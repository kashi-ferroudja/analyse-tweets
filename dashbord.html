<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Tweets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="mb-4">🧠 Analyse des Tweets</h1>
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Texte</th>
        <th>Fiabilité (%)</th>
        <th>Émotion</th>
        <th>Fake news ?</th>
      </tr>
    </thead>
    <tbody>
      {% for row in data %}
      <tr>
        <td>{{ row.text }}</td>
        <td>{{ row.reliability_score }}</td>
        <td>{{ row.top_emotion }}</td>
        <td>{{ row.fake_news_label }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
